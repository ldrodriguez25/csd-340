<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSD 340 Web Development with HTML and CSS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 18px;
        }

        #mainImage {
            width: 500px;
            height: 350px;
            object-fit: cover;
            border: 4px solid #333;
            border-radius: 10px;
            margin: 20px;
        }

        .gallery {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .gallery img {
            width: 120px;
            height: 90px;
            object-fit: cover;
            cursor: pointer;
            border: 3px solid #777;
            border-radius: 8px;
        }

        .gallery img:hover {
            border-color: #000;
        }
    </style>

    <script>
        function changeImage(imageFile, imageTitle) {
            document.getElementById("mainImage").src = imageFile;
            document.getElementById("imageTitle").textContent = imageTitle;
        }
    </script>
</head>

<body>

    <h1>Assignment 10.3: JavaScript - Part 2</h1>

    <p>Click an image below to change the main display.</p>

    <img id="mainImage" src="portrait.jpeg" alt="Portrait">

    <h2 id="imageTitle">Portrait</h2>

    <div class="gallery">

        <img src="portrait.jpeg"
             alt="Portrait"
             onclick="changeImage('portrait.jpeg', 'Portrait')">

        <img src="fitness.jpeg"
             alt="Fitness"
             onclick="changeImage('fitness.jpeg', 'Fitness')">

        <img src="mom.jpeg"
             alt="Family"
             onclick="changeImage('mom.jpeg', 'Family')">

        <img src="reading.jpeg"
             alt="Reading"
             onclick="changeImage('reading.jpeg', 'Reading')">

        <img src="travel.jpeg"
             alt="Travel"
             onclick="changeImage('travel.jpeg', 'Travel')">

    </div>

</body>
</html>
